apiVersion: v1
kind: ConfigMap
metadata:
  name: locust-scripts
  namespace: clickstream-pipeline
data:
  locustfile.py: |
    import os
    import uuid
    import random
    from datetime import datetime, timezone
    from locust import HttpUser, task, between

    CATEGORIES = ["Electronics", "Footwear", "Apparel", "Books", "Home & Kitchen", "Fitness"]
    PAGES = ["/", "/products/laptops", "/products/smartphones", "/products/headphones", "/categories/fashion", "/cart", "/checkout"]

    class ClickstreamUser(HttpUser):
        wait_time = between(0.05, 0.2)

        def on_start(self):
            self.user_id = f"user_{uuid.uuid4().hex[:12]}"
            self.session_id = str(uuid.uuid4())
            self.api_key = os.environ.get("ADMIN_API_KEY", "default-dev-key")
            self.headers = {"Content-Type": "application/json", "X-API-Key": self.api_key}

        def _generate_event(self, event_type, page_url=None):
            return {
                "schema_version": "1.0",
                "event_id": str(uuid.uuid4()),
                "user_id": self.user_id,
                "session_id": self.session_id,
                "event_type": event_type,
                "page_url": page_url or random.choice(PAGES),
                "product_id": f"prod_{random.randint(100, 999)}",
                "product_category": random.choice(CATEGORIES),
                "price_inr": round(random.uniform(99.0, 9999.0), 2),
                "timestamp": datetime.now(timezone.utc).isoformat()
            }

        @task(6)
        def browse(self):
            self.client.post("/api/events", json=self._generate_event("page_view"), headers=self.headers)

        @task(3)
        def add_cart(self):
            self.client.post("/api/events", json=self._generate_event("cart_add"), headers=self.headers)

        @task(1)
        def purchase(self):
            self.client.post("/api/events", json=self._generate_event("purchase"), headers=self.headers)
---
apiVersion: batch/v1
kind: Job
metadata:
  name: locust-load-test
  namespace: clickstream-pipeline
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: locust-load-test
    spec:
      restartPolicy: Never
      containers:
        - name: locust
          image: locustio/locust:2.24.0
          args:
            - "-f"
            - "/mnt/locust/locustfile.py"
            - "--headless"
            - "-u"
            - "100"
            - "-r"
            - "10"
            - "--run-time"
            - "3m"
            - "--host"
            - "http://producer.clickstream-pipeline.svc.cluster.local:5000"
          env:
            - name: ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: producer-secrets
                  key: admin-api-key
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: locust-script-volume
              mountPath: /mnt/locust
      volumes:
        - name: locust-script-volume
          configMap:
            name: locust-scripts
